# Bloco de servidor do nginx para o site da MAST.
# Copie para /etc/nginx/sites-available/mast e ajuste server_name e root.
server {
    listen 80;
    server_name mast.com.br www.mast.com.br;   # <- troque pelo seu domínio

    root /var/www/mast/public;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
